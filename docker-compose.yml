services:
  fitness-web-dev:
    profiles:
      - dev
    build:
      context: .
      target: development
      args:
        - APP_URL=${APP_URL}
        - APP_PORT=${APP_PORT}
        - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
    container_name: fitness-web
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - caddy_network
    labels:
      caddy: ${APP_URL}
      caddy.handle: /*
      caddy.handle.reverse_proxy: "{{upstreams 5173}}"
      caddy.header.Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; connect-src 'self' https: ws: wss:; img-src 'self' data: https:; font-src 'self' data: https:; frame-ancestors 'self'; upgrade-insecure-requests; require-trusted-types-for 'script';"
      caddy.header.Referrer-Policy: "strict-origin-when-cross-origin"
      caddy.header.Strict-Transport-Security: "max-age=300; includeSubDomains"
      caddy.header.X-Content-Type-Options: "nosniff"
      caddy.header.X-Frame-Options: "SAMEORIGIN"

  fitness-web-prod:
    profiles:
      - prod
    build:
      context: .
      target: production
      args:
        - APP_URL=${APP_URL}
        - APP_PORT=${APP_PORT}
        - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
    container_name: fitness-web
    restart: unless-stopped
    networks:
      - caddy_network
    labels:
      caddy: ${APP_URL}
      caddy.handle: /*
      caddy.handle.reverse_proxy: "{{upstreams 80}}"
      caddy.header.Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; connect-src 'self' https: wss:; img-src 'self' data: https:; font-src 'self' data: https:; frame-ancestors 'self'; upgrade-insecure-requests; require-trusted-types-for 'script';"
      caddy.header.Referrer-Policy: "strict-origin-when-cross-origin"
      caddy.header.Strict-Transport-Security: "max-age=300; includeSubDomains"
      caddy.header.X-Content-Type-Options: "nosniff"
      caddy.header.X-Frame-Options: "SAMEORIGIN"

networks:
  caddy_network:
    external: true